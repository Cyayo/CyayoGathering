# ========================================================
# CYAYO GATHERING - LEVELING CONFIGURATION
# ========================================================

enabled: true
max_level: 100

# Formula Otomatis Kebutuhan XP Tiap Level:
# Required XP = round(base_xp * (level ^ curve_multiplier))
# Contoh: base_xp 100 & multiplier 1.5
# Level 1->2: 100 XP | Level 5->6: 1,118 XP | Level 10->11: 3,162 XP | Level 25->26: 12,500 XP | Level 50->51: 35,355 XP
formula:
  base_xp: 100
  curve_multiplier: 1.5

# Notifikasi Action Bar saat panen/harvest charge
action_bar:
  enabled: true
  # Tampilkan notifikasi action bar saat pemain sudah mencapai level maksimal?
  # Secara default false (saat sudah max level, pemain tidak mendapatkan XP lagi dan Action Bar otomatis hilang)
  show_on_max_level: false
  # Format teks jika show_on_max_level bernilai true (gunakan 'none' jika tidak ingin menampilkan teks apapun)
  max_level_format: "none"
  format: "<color:#55FF55>+{xp} {category} XP</color> &8(&e{current_xp}&7/&a{req_xp}&8) &7[{progress_bar}&7]"
  progress_bar:
    length: 10
    symbol: "■"
    completed_color: "&a"
    remaining_color: "&7"

# ========================================================
# SISTEM HADIAH (REWARDS)
# ========================================================
rewards:
  # Hadiah standar yang dijalankan saat naik level biasa
  per_level:
    sound: "ENTITY_PLAYER_LEVELUP:1.0:1.2"
    title: "<gradient:#FFD700:#FFA500><bold>LEVEL UP!</bold></gradient>"
    subtitle: "&7Kemampuan &e{category}&7 naik ke &aLevel {level}&7!"
    # chat_message mendukung teks tunggal maupun list baris
    chat_message:
      - "&8[&6CyayoGathering&8] &7Selamat! Kemampuan &e{category}&7 kamu naik ke &aLevel {level}&7!"
      - "&7Hadiah level: <color:#55FF55>+50 Coins</color>"
    display_lore:
      - "&7■ <color:#55FF55>+50 Coins</color>"
    commands:
      - "eco give {player} 50"

  # Hadiah Khusus di Level Tertentu (TIDAK DOUBLE dengan per_level)
  # Level yang didaftarkan di sini HANYA akan mengeksekusi hadiah khusus ini
  # dan otomatis MELEWATKAN (skip) hadiah 'per_level' agar hadiah tidak dobel.
  #
  # Pengaturan Field:
  # - icon: (Opsional) Jika dihilangkan atau diset DEFAULT/NONE, otomatis menggunakan glass status yang sama dengan level lainnya (Hijau/Kuning/Merah).
  # - display_name: (Opsional) Nama item di GUI. Jika dihilangkan, otomatis mengikuti format nama level standar.
  # - display_lore: Lore hadiah yang ditampilkan pada item GUI.
  # - chat_message: (Opsional) Pesan chat khusus yang dikirimkan ke pemain (mendukung teks tunggal maupun list). Set 'none' jika tidak ingin mengirim pesan.
  # - broadcast: (Opsional) Pengumuman ke seluruh pemain lain di server (pemain yang naik level tidak akan melihat broadcast ini). Set 'none' jika tidak ingin broadcast.
  # - commands: Daftar perintah konsol yang dieksekusi sebagai hadiah level ini.
  #
  # TIPS: Setiap field notifikasi (title, subtitle, chat_message, broadcast, action_bar, sound) 
  # jika diset menjadi 'none' atau "none", sistem otomatis TIDAK AKAN MENGIRIM/MEMBUNYIKAN apapun.
  milestones:
    mining:
      5:
        # icon: "RAW_COPPER" # Hapus/beri pagar '#' jika ingin menggunakan glass yang sama seperti level lainnya
        display_name: "<gradient:#E07A5F:#F4F1DE><bold>HADIAH LEVEL 5</bold></gradient>"
        display_lore:
          - "&6★ &eCopper Key x1"
          - "&7■ <color:#55FF55>+500 Coins</color>"
        chat_message:
          - "&8[&6CyayoGathering&8] &6★ <bold>SELAMAT!</bold> Kamu mencapai &eMining Level 5&7!"
          - "&7Kamu mendapatkan hadiah spesial: &eCopper Key x1 &7dan &a+500 Coins&7!"
        broadcast: "&6{player} &7telah mencapai &eMining Level 5&7!"
        commands:
          - "eco give {player} 500"
          - "mi give MATERIAL COPPER_KEY {player} 1"
      10:
        # icon: "RAW_IRON"
        display_name: "<gradient:#D3D3D3:#FFFFFF><bold>HADIAH LEVEL 10</bold></gradient>"
        display_lore:
          - "&6★ &fIron Pickaxe x1"
