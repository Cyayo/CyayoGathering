id: "farming_wheat"
name: "<gradient:#FFD700:#FFA500><bold>Enchanted Golden Wheat</bold></gradient>"
category: "FARMING"

hitbox:
  width: 1.4
  height: 1.2
  hologram_offset_y: 1.8

charges:
  min: 6
  max: 12

base_gather_time_seconds: 2.0
inactivity_reset_seconds: 150
cooldown_seconds: 35

exp: 20.0
required_level: 1

tool_requirements:
  enabled: true
  allow_any_tool: false
  allowed_tools:
    - type: "VANILLA"
      material: "IRON_HOE"
    - type: "VANILLA"
      material: "DIAMOND_HOE"
    - type: "VANILLA"
      material: "NETHERITE_HOE"
    - type: "MMOITEMS"
      mmo_type: "TOOL"
      mmo_id: "*" # '*' means all items under this MMOType are permitted!
  durability_damage_per_gather: 1

effects:
  particle: "COMPOSTER"
  particle_count: 10
  particle_speed: 0.05
  particle_interval_ticks: 4
  swing_interval_ticks: 6
  sound_tick: "ITEM_HOE_TILL"
  sound_tick_pitch: 1.1
  sound_tick_volume: 0.35
  sound_tick_interval_ticks: 6
  sound_complete: "BLOCK_CROP_BREAK"
  sound_complete_pitch: 1.3
  sound_complete_volume: 0.8

drop_table:
  use-luck: true
  use-double-drop: true
  bonus-luck-percent: 0.0
  items:
    - type: mmoitems
      mmo-type: MATERIAL
      id: GOLDEN_WHEAT_BUNDLE
      base: 75
      amount: 1
      broadcast: "&e{player} &6harvested a rare Golden Wheat Bundle!"
    - type: vanilla
      material: GOLDEN_CARROT
      base: 25
      amount: 2
    - type: vanilla
      material: HAY_BLOCK
      base: 10
      amount: 1
    # Fallback default item
    - type: vanilla
      material: WHEAT
      amount: 3

hologram_format:
  ready:
    - "{name}"
    - "&7Crops: {charges_color}{charges}&7/&a{max_charges} &8[{charges_bar}&8]"
    - "&eLeft or Right-Click with a Hoe to harvest"
  gathering:
    - "{name}"
    - "&7Harvester: &b{gatherer}"
    - "&fHarvesting: &e{percent}% &8[{progress_bar}&8]"
  cooldown:
    - "&8[ Regrowing Crops ]"
    - "<gray>Available in: <yellow>{cooldown}s</yellow>"
